<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="docTitle">ClubGestor — Gestión Deportiva</title>
<!-- ClubGestor: tabla completa con desplazamiento horizontal + ficha individual -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--p:#166534;--p2:#14532d;--bg:#f3f6f4;--card:#fff;--text:#172018;--muted:#68746b;--line:#dfe7e1;--danger:#b91c1c;--okbg:#dcfce7;--warnbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:240px;background:#10251a;color:#fff;padding:20px 14px;position:fixed;top:0;bottom:0}.brand{padding:8px 10px 24px;font-size:23px;font-weight:800}.brand small{display:block;color:#a7f3d0;font-size:10px;margin-top:4px;letter-spacing:.5px}
.nav button{display:block;width:100%;background:transparent;border:0;color:#d1fae5;text-align:left;padding:12px;border-radius:9px;margin:3px 0;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#1f3a29;color:#fff}
.main{margin-left:240px;width:calc(100% - 240px);padding:25px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer}button.primary{background:var(--p);color:#fff;border-color:var(--p)}button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:0 2px 7px #10251a0b}.num{font-size:29px;font-weight:800}.label{font-size:12px;color:var(--muted)}.kpi{min-height:105px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.left,.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{width:100%;padding:10px;border:1px solid #cfd8d1;border-radius:8px;background:#fff;font:inherit}textarea{width:100%;min-height:80px;padding:10px;border:1px solid #cfd8d1;border-radius:8px;font:inherit}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.span2{grid-column:span 2}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;width:100%;min-width:1500px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{font-size:11px;text-transform:uppercase;background:#f7faf8;color:#526158}tr:hover td{background:#fbfdfb}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.green{background:var(--okbg);color:var(--p)}.red{background:#fee2e2;color:var(--danger)}.yellow{background:var(--warnbg);color:#92400e}.muted{color:var(--muted)}.empty{text-align:center;padding:35px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#10251a99;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;padding:20px;width:min(820px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 16px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.logoBox{display:flex;align-items:center;gap:15px}.logoPreview{width:80px;height:80px;object-fit:contain;border:1px dashed #aab6ad;border-radius:12px;background:#fafcfb}.clubHero{display:flex;align-items:center;gap:15px}.clubHero img{width:70px;height:70px;object-fit:contain;border-radius:12px}
.attMatrix th,.attMatrix td{text-align:center;white-space:nowrap;padding:7px 5px}.attMatrix th:first-child,.attMatrix td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}.attDay{min-width:48px;line-height:1.15}.attDay small{display:block;font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase}.attDay.sunday{background:#fef2f2;color:#991b1b}.attDay.saturday{background:#fff7ed;color:#9a3412}.attCell{width:34px;height:32px;padding:0;border-radius:7px;font-size:11px;font-weight:800}.attP{background:#dcfce7;color:#166534;border-color:#bbf7d0}.attA{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.attE{background:#fef3c7;color:#92400e;border-color:#fde68a}.attR{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.attEmpty{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.athleteProfileHead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;background:#f7faf8;border:1px solid var(--line);border-radius:12px}.athleteProfileName{font-size:22px;font-weight:800}.athleteProfileSub{margin-top:4px;color:var(--muted);font-size:13px}.viewCard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.viewRow{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;border-bottom:1px solid #edf1ee;min-height:50px}.viewRow:last-child{border-bottom:0}.viewLabel{padding:11px 14px;font-size:12px;font-weight:700;color:#526158;background:#fafcfb}.viewValue{padding:11px 14px;font-size:15px;text-align:right;overflow-wrap:anywhere}.viewActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.printOnly{display:none}.printReport{font-family:Arial,sans-serif;color:#111}.printHeader{display:flex;align-items:center;gap:14px;border-bottom:2px solid #166534;padding-bottom:10px;margin-bottom:14px}.printHeader img{width:70px;height:70px;object-fit:contain}.printReport h1{margin:0;font-size:22px}.printReport h2{margin:4px 0 2px;font-size:17px}.printMeta,.printFoot{font-size:10px;color:#555}.printReport table{min-width:0;width:100%;border-collapse:collapse;table-layout:auto}.printReport th,.printReport td{border:1px solid #bbb;padding:5px 4px;font-size:8.5px;text-align:center}.printReport th{background:#eee}.printReport td:first-child,.printReport th:first-child{text-align:left}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:650px){.app{display:block}.sidebar{position:static;width:100%}.main{margin:0;width:100%;padding:14px}.grid,.grid2,.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.top{display:block}.actions{margin-top:10px}.nav{display:grid;grid-template-columns:1fr 1fr}}

/* En celular, la tabla de deportistas conserva su formato completo y se desplaza horizontalmente. */
.athleteTableWrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.athleteTable{min-width:1500px}
@media(max-width:650px){
  .athleteTableWrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);background:#fff}
  .athleteTable{display:table;min-width:1500px !important;width:max-content !important}
  .athleteTable thead{display:table-header-group}
  .athleteTable tbody{display:table-row-group}
  .athleteTable tr{display:table-row;background:transparent;border:0;border-radius:0;margin:0;padding:0;box-shadow:none}
  .athleteTable td,.athleteTable th{display:table-cell;width:auto;min-width:0;border-bottom:1px solid var(--line);padding:10px 11px;font-size:13px;text-align:left;vertical-align:middle}
  .athleteTable td::before{display:none !important}
  .athleteTable td:nth-child(13){display:table-cell;padding:10px 11px}
  .athleteTable td:nth-child(13) > div{display:flex !important;grid-template-columns:none;gap:5px !important;flex-wrap:wrap}
  .athleteTable td:nth-child(13) button{width:auto;min-height:40px;white-space:nowrap}
  #athSearch{width:100% !important}
}

@media print{body{background:#fff!important}.app,.modal{display:none!important}.printOnly{display:block!important}.printReport{width:100%;padding:0;margin:0}.printReport table{page-break-inside:auto}.printReport tr{page-break-inside:avoid}.printReport thead{display:table-header-group}@page{size:A4 landscape;margin:8mm}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand" id="appBrand">ClubGestor V2<small>GESTIÓN DEL CLUB</small></div>
  <nav class="nav">
    <button data-page="home">🏠 Inicio</button>
    <button data-page="athletes">👥 Deportistas</button>
    <button data-page="attendance">✅ Asistencia</button>
    <button data-page="payments">💳 Mensualidades</button>
    <button data-page="club">🏷️ Club y logo</button>
  </nav>
</aside>
<main class="main"><div id="app"></div></main>
</div>
<div class="modal" id="modal"><div class="modalbox">
  <div class="modalhead"><h2 id="modalTitle"></h2><button type="button" onclick="closeModal()">✕</button></div>
  <div id="modalBody"></div>
  <div class="modalfoot"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary" id="modalSave">Guardar</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const KEY='clubgestor_local_v3';
const oldKey='clubgestor_v2';
const seed={appName:'ClubGestor V2',club:{name:'Mi Club Deportivo',logo:''},athletes:[],attendance:[],payments:[]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function normalizeDb(x){x=x||{};return {appName:x.appName||'ClubGestor V2',club:x.club||{name:'Mi Club Deportivo',logo:''},athletes:Array.isArray(x.athletes)?x.athletes:[],attendance:Array.isArray(x.attendance)?x.attendance:[],payments:Array.isArray(x.payments)?x.payments:[]}}
let db;
try{
  const local=localStorage.getItem(KEY);
  const old=localStorage.getItem(oldKey);
  db=normalizeDb(local?JSON.parse(local):(old?JSON.parse(old):seed));
  localStorage.setItem(KEY,JSON.stringify(db));
}catch(e){db=clone(seed)}
let page='home';

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openModal(title,body,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').onclick=fn;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function header(title,sub,actions=''){return `<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function syncBrand(){document.getElementById('appBrand').innerHTML=esc(db.appName)+'<small>GESTIÓN DEL CLUB</small>';document.getElementById('docTitle').textContent=db.appName+' — Gestión Deportiva'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});

function ageFromBirth(birth){
  if(!birth)return null;
  const b=new Date(birth+'T00:00:00'),t=new Date();
  let age=t.getFullYear()-b.getFullYear();
  const before=t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate());
  if(before)age--;
  return age>=0?age:null;
}
function categoryFromAge(age){
  if(age==null)return 'Sin categoría';
  if(age<7)return 'Fuera de categoría';
  if(age<=9)return 'Benjamín';
  if(age<=12)return 'Mini-Vóley (U13)';
  if(age<=14)return 'Infantil (U15)';
  if(age<=16)return 'Prejuvenil (U17)';
  if(age<=18)return 'Juvenil (U19/U21)';
  if(age<=29)return 'Mayores / Mayores Libre';
  if(age<=39)return 'Máster +30';
  if(age<=49)return 'Máster +40';
  return 'Máster +50';
}
function ageCategory(a){const age=ageFromBirth(a.birth);return {age,category:categoryFromAge(age)}}

function render(){syncBrand();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,athletes,attendance,payments,club}[page]||home)()}

function home(){
 const today=new Date().toISOString().slice(0,10), present=db.attendance.filter(x=>x.date===today&&x.status==='P').length;
 const d=new Date(),paid=db.payments.filter(x=>x.paid&&Number(x.year)===d.getFullYear()&&Number(x.month)===d.getMonth()+1).length;
 document.getElementById('app').innerHTML=header('Inicio','Panel general del club',`<button class="primary" onclick="openAthlete()">+ Deportista</button>`)
 +`<div class="card clubHero" style="margin-bottom:14px;justify-content:space-between"><div class="clubHero">${db.club.logo?`<img src="${db.club.logo}">`:'<div style="font-size:48px">🏆</div>'}<div><div class="label">CLUB</div><h2 style="margin:2px 0">${esc(db.club.name)}</h2><p class="muted" style="margin:0">Gestión local de deportistas, asistencia y mensualidades.</p></div></div><button onclick="page='club';render()">✏️ Editar club</button></div>
 <div class="grid"><div class="card kpi"><div class="label">DEPORTISTAS</div><div class="num">${db.athletes.length}</div></div><div class="card kpi"><div class="label">PRESENTES HOY</div><div class="num">${present}</div></div><div class="card kpi"><div class="label">PAGOS ESTE MES</div><div class="num">${paid}</div></div><div class="card kpi"><div class="label">PENDIENTES ESTE MES</div><div class="num">${Math.max(0,db.athletes.length-paid)}</div></div></div>
 <div style="height:14px"></div><div class="grid2"><div class="card"><h3>Acciones rápidas</h3><p><button class="primary" onclick="openAthlete()">Agregar deportista</button></p><p><button onclick="openAttendance()">Registrar asistencia</button></p><p><button onclick="payments()">Ver mensualidades</button></p></div><div class="card"><h3>Información</h3><p class="muted">Esta versión funciona sin Firebase, sin nube y sin contraseña. Los datos quedan guardados en este dispositivo.</p></div></div>`;
}

function athletePdfData(a){
 const ac=ageCategory(a);
 const sport=(a.sport==='Otro deporte'?(a.otherSport||'Otro deporte'):a.sport);
 return `
 <div class="printHeader">
 ${db.club.logo?`<img src="${db.club.logo}">`:''}
 <div>
   <h1>${esc(db.club.name||'Mi Club Deportivo')}</h1>
   <h2>Ficha completa del deportista</h2>
   <div class="printMeta">Generado desde ${esc(db.appName)}</div>
 </div>
 </div>

 <table>
 <tbody>
 <tr><th>Nombre completo</th><td>${esc(a.name||'—')}</td><th>Edad</th><td>${ac.age??'—'} años</td></tr>
 <tr><th>Tipo de documento</th><td>${esc(a.docType||'—')}</td><th>Número de documento</th><td>${esc(a.document||'—')}</td></tr>
 <tr><th>Fecha de nacimiento</th><td>${esc(a.birth||'—')}</td><th>Categoría automática</th><td>${esc(ac.category)}</td></tr>
 <tr><th>Deporte</th><td>${esc(sport)}</td><th>Peso</th><td>${esc(a.weight||'—')} kg</td></tr>
 <tr><th>Talla</th><td>${esc(a.height||'—')} cm</td><th>Celular</th><td>${esc(a.phone||'—')}</td></tr>
 <tr><th>Dirección</th><td colspan="3">${esc(a.address||'—')}</td></tr>
 <tr><th>EPS</th><td colspan="3">${esc(a.eps||'—')}</td></tr>
 </tbody>
 </table>`;
}

function printAthletePDF(id){const a=db.athletes.find(x=>x.id===id);if(!a)return;printShell('Ficha individual',`Deportista: ${a.name}`,athletePdfData(a))}
function printAllAthletesPDF(){
 const rows=db.athletes.map(a=>{
   const ac=ageCategory(a);
   const sport=(a.sport==='Otro deporte'?(a.otherSport||'Otro deporte'):a.sport);
   return `<tr>
     <td>${esc(a.name||'')}</td>
     <td>${esc(a.docType||'')}</td>
     <td>${esc(a.document||'')}</td>
     <td>${esc(a.birth||'')}</td>
     <td>${ac.age??'—'}</td>
     <td>${esc(ac.category)}</td>
     <td>${esc(a.weight||'')} kg</td>
     <td>${esc(a.height||'')} cm</td>
     <td>${esc(sport)}</td>
     <td>${esc(a.address||'')}</td>
     <td>${esc(a.phone||'')}</td>
     <td>${esc(a.eps||'')}</td>
   </tr>`
 }).join('')||'<tr><td colspan="12">No hay deportistas registrados.</td></tr>';

 printShell(
   'Base de datos completa de deportistas',
   `${db.athletes.length} deportistas registrados`,
   `<table>
     <thead>
       <tr>
         <th>Nombre completo</th>
         <th>Tipo documento</th>
         <th>Número documento</th>
         <th>Nacimiento</th>
         <th>Edad</th>
         <th>Categoría</th>
         <th>Peso</th>
         <th>Talla</th>
         <th>Deporte</th>
         <th>Dirección</th>
         <th>Celular</th>
         <th>EPS</th>
       </tr>
     </thead>
     <tbody>${rows}</tbody>
   </table>`
 );
}

function printShell(title,subtitle,body){
 const old=document.getElementById('printReport');if(old)old.remove();
 const r=document.createElement('div');r.id='printReport';r.className='printOnly printReport';
 r.innerHTML=`<div class="printHeader">${db.club.logo?`<img src="${db.club.logo}">`:''}<div><h1>${esc(db.club.name||'Mi Club Deportivo')}</h1><h2>${esc(title)}</h2><div class="printMeta">${esc(subtitle)}</div></div></div>${body}<div class="printFoot">Generado desde ${esc(db.appName)} · ${new Date().toLocaleString('es-CO')}</div>`;
 document.body.appendChild(r);
 r.style.display='block';

 // En celular generamos un PDF real y lo abrimos en el visor del dispositivo.
 // Así se puede ampliar/reducir con el gesto de dos dedos.
 const pdfWindow=window.open('about:blank','_blank');
 const fallbackPrint=()=>{
   if(pdfWindow&&!pdfWindow.closed){try{pdfWindow.close()}catch(e){}}
   const app=document.querySelector('.app');
   const modal=document.getElementById('modal');
   const prevApp=app?app.style.display:'';
   const prevModal=modal?modal.style.display:'';
   if(app)app.style.display='none';
   if(modal)modal.style.display='none';
   window.onafterprint=()=>{
     if(app)app.style.display=prevApp;
     if(modal)modal.style.display=prevModal;
     if(r.parentNode)r.remove();
   };
   try{window.print()}catch(e){
     if(r.parentNode)r.remove();
     alert('No fue posible abrir el PDF en este navegador.');
   }
 };

 if(!window.html2pdf){fallbackPrint();return;}

 const safeName=(title||'ClubGestor').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ -]/g,'').trim().replace(/\s+/g,'_')||'ClubGestor';
 const options={
   margin:[8,8,8,8],
   filename:`${safeName}.pdf`,
   image:{type:'jpeg',quality:0.98},
   html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},
   jsPDF:{unit:'mm',format:'a4',orientation:'landscape',compress:true},
   pagebreak:{mode:['css','legacy']}
 };

 html2pdf().set(options).from(r).outputPdf('blob').then(blob=>{
   if(!blob)throw new Error('No se pudo generar el PDF');
   const url=URL.createObjectURL(blob);
   if(pdfWindow&&!pdfWindow.closed){
     pdfWindow.location.href=url;
   }else{
     const a=document.createElement('a');a.href=url;a.download=`${safeName}.pdf`;document.body.appendChild(a);a.click();a.remove();
   }
   setTimeout(()=>{if(r.parentNode)r.remove();},1000);
   setTimeout(()=>URL.revokeObjectURL(url),60000);
 }).catch(err=>{
   console.error('Error generando PDF:',err);
   fallbackPrint();
 });
}

function athletes(){
 document.getElementById('app').innerHTML=header('Deportistas','Base de datos completa de los integrantes del club',`<button onclick="printAllAthletesPDF()">📄 PDF base de datos</button><button class="primary" onclick="openAthlete()">+ Nuevo deportista</button>`)
 +`<div class="toolbar"><div class="left"><input id="athSearch" placeholder="Buscar por nombre, documento o deporte..." style="width:320px"></div><span class="muted">${db.athletes.length} deportistas</span></div>
 <div class="tablewrap athleteTableWrap"><table class="athleteTable"><thead><tr><th>Nombre completo</th><th>Tipo documento</th><th>Número documento</th><th>Nacimiento</th><th>Edad</th><th>Peso</th><th>Talla</th><th>Deporte</th><th>Categoría</th><th>Dirección</th><th>Celular</th><th>EPS</th><th>Acciones</th></tr></thead><tbody id="athBody"></tbody></table></div>`;
 renderAthletes();
}
function renderAthletes(){
 const q=(document.getElementById('athSearch')?.value||'').toLowerCase(),body=document.getElementById('athBody');if(!body)return;
 body.innerHTML=db.athletes.filter(a=>(a.name+' '+a.document+' '+a.sport+' '+(a.otherSport||'')).toLowerCase().includes(q)).map(a=>{
  const ac=ageCategory(a);
  return `<tr>
<td><b>${esc(a.name)}</b></td>
<td>${esc(a.docType||'')}</td>
<td>${esc(a.document||'')}</td>
<td>${esc(a.birth||'')}</td>
<td>${ac.age??'—'}</td>
<td>${esc(a.weight||'')} kg</td>
<td>${esc(a.height||'')} cm</td>
<td>${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</td>
<td><span class="pill green">${esc(ac.category)}</span></td>
<td>${esc(a.address||'')}</td>
<td>${esc(a.phone||'')}</td>
<td>${esc(a.eps||'')}</td>
<td><div style="display:flex;gap:5px;flex-wrap:wrap">
<button onclick="viewAthlete('${a.id}')">👁️ Ver</button>
<button onclick="editAthlete('${a.id}')">Editar</button>
<button onclick="printAthletePDF('${a.id}')">PDF</button>
<button class="danger" onclick="deleteAthlete('${a.id}')">Eliminar</button>
</div></td>
</tr>`
 }).join('')||'<tr><td colspan="13" class="empty">No hay deportistas registrados.</td></tr>';
}
document.addEventListener('input',e=>{if(e.target.id==='athSearch')renderAthletes()});

function openAthlete(existing=null){
 const a=existing||{name:'',docType:'Cédula',document:'',birth:'',weight:'',height:'',sport:'Fútbol',otherSport:'',category:'',address:'',phone:'',eps:''};
 const ac=ageCategory(a);
 openModal(existing?'Editar deportista':'Nuevo deportista',`<div class="formgrid">
 <div class="field span2"><label>Nombre completo *</label><input id="aName" value="${esc(a.name)}"></div>
 <div class="field"><label>Tipo de documento *</label><select id="aDocType"><option ${a.docType==='Cédula'?'selected':''}>Cédula</option><option ${a.docType==='Tarjeta de identidad'?'selected':''}>Tarjeta de identidad</option><option ${a.docType==='Pasaporte'?'selected':''}>Pasaporte</option><option ${a.docType==='Otro'?'selected':''}>Otro</option></select></div>
 <div class="field"><label>Número *</label><input id="aDoc" value="${esc(a.document)}"></div>
 <div class="field"><label>Fecha de nacimiento</label><input id="aBirth" type="date" value="${esc(a.birth)}" onchange="previewAgeCategory()"></div>
 <div class="field"><label>Edad actual</label><input id="aAge" value="${ac.age??''}" readonly></div>
 <div class="field"><label>Categoría automática</label><input id="aCat" value="${esc(ac.category)}" readonly></div>
 <div class="field"><label>Peso (kg)</label><input id="aWeight" type="number" min="0" step=".1" value="${esc(a.weight)}"></div>
 <div class="field"><label>Talla (cm)</label><input id="aHeight" type="number" min="0" step=".1" value="${esc(a.height)}"></div>
 <div class="field"><label>Deporte</label><select id="aSport"><option>Fútbol</option><option>Baloncesto</option><option>Voleibol</option><option>Bádminton</option><option>Atletismo</option><option>Natación</option><option>Ciclismo</option><option>Otro deporte</option></select></div>
 <div class="field"><label>Si es otro deporte</label><input id="aOtherSport" value="${esc(a.otherSport||'')}"></div>
 <div class="field span2"><label>Dirección</label><input id="aAddress" value="${esc(a.address)}"></div>
 <div class="field"><label>Celular</label><input id="aPhone" value="${esc(a.phone)}"></div>
 <div class="field"><label>EPS</label><input id="aEps" value="${esc(a.eps)}"></div>
 </div><div class="card" style="margin-top:8px"><b>Clasificación:</b> <span id="catPreview">${esc(ac.category)}</span> · <span id="agePreview">${ac.age??'—'} años</span></div>`,
 ()=>{
  const x={...a,id:a.id||uid('ath'),name:document.getElementById('aName').value.trim(),docType:document.getElementById('aDocType').value,document:document.getElementById('aDoc').value.trim(),birth:document.getElementById('aBirth').value,weight:document.getElementById('aWeight').value,height:document.getElementById('aHeight').value,sport:document.getElementById('aSport').value,otherSport:document.getElementById('aOtherSport').value.trim(),category:categoryFromAge(ageFromBirth(document.getElementById('aBirth').value)),address:document.getElementById('aAddress').value.trim(),phone:document.getElementById('aPhone').value.trim(),eps:document.getElementById('aEps').value.trim()};
  if(!x.name||!x.document)return alert('Nombre y número de documento son obligatorios.');
  if(x.sport==='Otro deporte'&&!x.otherSport)return alert('Indique cuál es el otro deporte.');
  if(existing)db.athletes=db.athletes.map(z=>z.id===a.id?x:z);else db.athletes.push(x);
  save();closeModal();render();
 });
 document.getElementById('aSport').value=a.sport||'Fútbol';
}
function previewAgeCategory(){const age=ageFromBirth(document.getElementById('aBirth').value),cat=categoryFromAge(age);document.getElementById('aAge').value=age??'';document.getElementById('aCat').value=cat;document.getElementById('agePreview').textContent=(age??'—')+' años';document.getElementById('catPreview').textContent=cat}

function viewAthlete(id){
 const a=db.athletes.find(x=>x.id===id);
 if(!a)return;
 const ac=ageCategory(a);
 const sport=(a.sport==='Otro deporte'?(a.otherSport||'Otro deporte'):a.sport);
 const row=(label,value,cls='')=>`<div class="viewRow ${cls}"><div class="viewLabel">${label}</div><div class="viewValue">${value||'—'}</div></div>`;
 openModal(
  'Ficha del deportista',
  `<div class="athleteProfileHead">
    <div>
      <div class="athleteProfileName">${esc(a.name)}</div>
      <div class="athleteProfileSub">${esc(sport)} · ${esc(ac.category)} · ${ac.age??'—'} años</div>
    </div>
    <span class="pill green">${esc(ac.category)}</span>
  </div>
  <div class="viewCard">
    ${row('NOMBRE',esc(a.name))}
    ${row('TIPO DOCUMENTO',esc(a.docType||'—'))}
    ${row('NÚMERO DOCUMENTO',esc(a.document||'—'))}
    ${row('NACIMIENTO',esc(a.birth||'—'))}
    ${row('EDAD',`${ac.age??'—'} años`)}
    ${row('PESO',a.weight?esc(a.weight)+' kg':'—')}
    ${row('TALLA',a.height?esc(a.height)+' cm':'—')}
    ${row('DEPORTE',esc(sport))}
    ${row('CATEGORÍA',`<span class="pill green">${esc(ac.category)}</span>`)}
    ${row('DIRECCIÓN',esc(a.address||'—'))}
    ${row('CELULAR',esc(a.phone||'—'))}
    ${row('EPS',esc(a.eps||'—'))}
  </div>
  <div class="viewActions">
    <button type="button" onclick="editAthlete('${a.id}');">✏️ Editar ficha</button>
    <button type="button" onclick="printAthletePDF('${a.id}')">📄 PDF</button>
  </div>`,
  ()=>closeModal()
 );
 document.getElementById('modalSave').textContent='Cerrar';
}

function editAthlete(id){openAthlete(db.athletes.find(a=>a.id===id))}
function deleteAthlete(id){const a=db.athletes.find(x=>x.id===id);if(!a)return;if(!confirm(`¿Eliminar a ${a.name}? También se eliminarán sus asistencias y mensualidades.`))return;db.athletes=db.athletes.filter(x=>x.id!==id);db.attendance=db.attendance.filter(x=>x.athleteId!==id);db.payments=db.payments.filter(x=>x.athleteId!==id);save();render()}

function daysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function dateKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function weekdayShort(y,m,d){return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][new Date(Date.UTC(y,m-1,d)).getUTCDay()]}
function dayClass(y,m,d){const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return w===0?'sunday':w===6?'saturday':''}
function attInfo(id,date){return db.attendance.find(x=>x.athleteId===id&&x.date===date)}

function attendance(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
 document.getElementById('app').innerHTML=header('Asistencia','Control diario organizado por mes',`<button onclick="printAttendancePDF()">🖨️ PDF</button><button class="primary" onclick="openAttendance()">+ Registrar día</button>`)
 +`<div class="card"><div class="toolbar"><div class="left"><label style="font-size:12px;font-weight:700">Año</label><input id="attYear" type="number" min="1900" max="9999" value="${y}" style="width:110px"><select id="attMonth" style="width:170px">${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((x,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${x}</option>`).join('')}</select></div><div class="right"><span id="attMonthTitle" class="monthTitle"></span></div></div><div id="attStats" class="muted"></div><div class="tablewrap" style="margin-top:10px"><table class="attMatrix"><thead id="attHead"></thead><tbody id="attBody"></tbody></table></div><div class="legend"><span>🟢 P = Presente</span><span>🔴 I = Inasistencia</span><span>🟡 E = Excusa</span><span>🟠 R = Retardo</span><span>· = Sin registrar</span><span>🟠 Sáb · 🔴 Dom</span></div></div>`;
 renderAttendance();
}
function renderAttendance(){
 const y=Number(document.getElementById('attYear')?.value),m=Number(document.getElementById('attMonth')?.value),head=document.getElementById('attHead'),body=document.getElementById('attBody');if(!head||!body||!y||y<1900||y>9999)return;
 const days=daysInMonth(y,m);document.getElementById('attMonthTitle').textContent=`${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m-1]} ${y}`;
 head.innerHTML=`<tr><th>Deportista</th><th>Deporte</th>${Array.from({length:days},(_,i)=>`<th class="attDay ${dayClass(y,m,i+1)}"><small>${weekdayShort(y,m,i+1)}</small>${i+1}</th>`).join('')}<th>P</th><th>I</th><th>E</th><th>R</th><th>%</th></tr>`;
 const totals={P:0,A:0,E:0,R:0};
 body.innerHTML=db.athletes.map(a=>{
  const cells=Array.from({length:days},(_,i)=>{const date=dateKey(y,m,i+1),r=attInfo(a.id,date),s=r?.status||'',cls=s==='P'?'attP':s==='A'?'attA':s==='E'?'attE':s==='R'?'attR':'attEmpty';if(s)totals[s]++;return `<td><button class="attCell ${cls}" onclick="cycleAttendance('${a.id}','${date}')" title="${date}">${s==='A'?'I':s||'·'}</button></td>`}).join('');
  const rec=db.attendance.filter(x=>x.athleteId===a.id&&x.date>=dateKey(y,m,1)&&x.date<=dateKey(y,m,days));
  const p=rec.filter(x=>x.status==='P').length,aa=rec.filter(x=>x.status==='A').length,e=rec.filter(x=>x.status==='E').length,r=rec.filter(x=>x.status==='R').length,base=p+aa+e+r,pct=base?Math.round(p/base*100):0;
  return `<tr><td><b>${esc(a.name)}</b><div class="muted" style="font-size:10px">${esc(categoryFromAge(ageFromBirth(a.birth)))}</div></td><td>${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</td>${cells}<td>${p}</td><td>${aa}</td><td>${e}</td><td>${r}</td><td><b>${pct}%</b></td></tr>`
 }).join('')||`<tr><td colspan="${days+7}" class="empty">No hay deportistas registrados.</td></tr>`;
 document.getElementById('attStats').textContent=`Registros: ${totals.P+totals.A+totals.E+totals.R} · P: ${totals.P} · I: ${totals.A} · E: ${totals.E} · R: ${totals.R}`;
}
document.addEventListener('change',e=>{if(e.target.id==='attMonth'||e.target.id==='attYear')renderAttendance()});
function cycleAttendance(id,date){const order=['','P','A','E','R'],old=attInfo(id,date),cur=old?.status||'',next=order[(order.indexOf(cur)+1)%order.length];db.attendance=db.attendance.filter(x=>!(x.athleteId===id&&x.date===date));if(next)db.attendance.push({id:uid('att'),athleteId:id,date,status:next,note:''});save();renderAttendance()}
function openAttendance(){
 const date=new Date().toISOString().slice(0,10);
 const rows=db.athletes.map(a=>`<div style="display:grid;grid-template-columns:1fr 160px 1fr;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #dfe7e1"><div><b>${esc(a.name)}</b><br><small class="muted">${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</small></div><select class="attStatus" data-id="${a.id}"><option value="P">Presente</option><option value="A">Inasistencia</option><option value="E">Excusa</option><option value="R">Retardo</option></select><input class="attNote" data-id="${a.id}" placeholder="Observación"></div>`).join('');
 openModal('Registrar asistencia de un día',`<div class="field"><label>Fecha</label><input id="attDate" type="date" value="${date}"></div><div class="card">${rows||'<div class="empty">Primero registre deportistas.</div>'}</div>`,()=>{const dt=document.getElementById('attDate').value;if(!dt)return alert('Seleccione una fecha.');document.querySelectorAll('.attStatus').forEach(s=>{const id=s.dataset.id,n=document.querySelector(`.attNote[data-id="${id}"]`)?.value||'';db.attendance=db.attendance.filter(x=>!(x.athleteId===id&&x.date===dt));db.attendance.push({id:uid('att'),athleteId:id,date:dt,status:s.value,note:n})});save();closeModal();render()})
}

function payments(){
 const y=new Date().getFullYear();
 document.getElementById('app').innerHTML=header('Mensualidades','Control mensual de pagos por deportista',`<button onclick="printPaymentsPDF()">🖨️ PDF</button><button class="primary" onclick="openPayment()">+ Registrar pago</button>`)
 +`<div class="card"><div class="toolbar"><div class="left"><label style="font-size:12px;font-weight:700">Año</label><input id="payYear" type="number" min="1900" max="9999" value="${y}" style="width:110px"><input id="paySearch" placeholder="Buscar deportista..." style="width:260px"></div><span class="muted">Pulsa PAGÓ / DEBE para cambiar.</span></div><div class="tablewrap"><table><thead><tr><th>Deportista</th><th>Deporte</th>${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="payBody"></tbody></table></div></div>`;
 renderPayments();
}
function renderPayments(){
 const y=Number(document.getElementById('payYear')?.value),q=(document.getElementById('paySearch')?.value||'').toLowerCase(),body=document.getElementById('payBody');if(!body||!y)return;
 body.innerHTML=db.athletes.filter(a=>a.name.toLowerCase().includes(q)).map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</td>${Array.from({length:12},(_,i)=>{const p=db.payments.find(x=>x.athleteId===a.id&&Number(x.year)===y&&Number(x.month)===i+1);return `<td><button class="statusBtn ${p?.paid?'green':'red'}" onclick="togglePay('${a.id}',${i+1},${y})">${p?.paid?'PAGÓ':'DEBE'}</button></td>`}).join('')}</tr>`).join('')||'<tr><td colspan="14" class="empty">No hay deportistas.</td></tr>';
}
document.addEventListener('input',e=>{if(e.target.id==='paySearch')renderPayments()});
document.addEventListener('change',e=>{if(e.target.id==='payYear')renderPayments()});
function togglePay(id,month,year){const i=db.payments.findIndex(x=>x.athleteId===id&&Number(x.month)===month&&Number(x.year)===year);if(i>=0)db.payments.splice(i,1);else db.payments.push({id:uid('pay'),athleteId:id,month,year,paid:true,value:0,date:new Date().toISOString().slice(0,10)});save();renderPayments()}
function openPayment(){
 if(!db.athletes.length)return alert('Primero registre deportistas.');
 openModal('Registrar mensualidad',`<div class="formgrid"><div class="field span2"><label>Deportista</label><select id="pmAth">${db.athletes.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Año</label><input id="pmYear" type="number" min="1900" max="9999" value="${new Date().getFullYear()}"></div><div class="field"><label>Mes</label><select id="pmMonth">${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'].map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}</select></div><div class="field"><label>Valor</label><input id="pmValue" type="number" min="0"></div><div class="field"><label>Fecha de pago</label><input id="pmDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>`,()=>{const id=document.getElementById('pmAth').value,year=Number(document.getElementById('pmYear').value),month=Number(document.getElementById('pmMonth').value);if(!year||year<1900||year>9999)return alert('Año no válido.');db.payments=db.payments.filter(x=>!(x.athleteId===id&&Number(x.year)===year&&Number(x.month)===month));db.payments.push({id:uid('pay'),athleteId:id,year,month,paid:true,value:Number(document.getElementById('pmValue').value)||0,date:document.getElementById('pmDate').value});save();closeModal();render()})
}
function printPaymentsPDF(){
 const y=Number(document.getElementById('payYear')?.value)||new Date().getFullYear();
 const rows=db.athletes.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</td>${Array.from({length:12},(_,i)=>{const p=db.payments.find(x=>x.athleteId===a.id&&Number(x.year)===y&&Number(x.month)===i+1);return `<td>${p?.paid?'PAGÓ':'DEBE'}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="14">No hay deportistas.</td></tr>';
 printShell(`Informe de mensualidades · ${y}`,`PAGÓ / DEBE`,`<table><thead><tr><th>Deportista</th><th>Deporte</th>${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`);
}
function printAttendancePDF(){
 const y=Number(document.getElementById('attYear')?.value)||new Date().getFullYear(),m=Number(document.getElementById('attMonth')?.value)||new Date().getMonth()+1,days=daysInMonth(y,m);
 const rows=db.athletes.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.sport==='Otro deporte'?a.otherSport:a.sport)}</td>${Array.from({length:days},(_,i)=>`<td>${attInfo(a.id,dateKey(y,m,i+1))?.status==='A'?'I':attInfo(a.id,dateKey(y,m,i+1))?.status||'·'}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${days+2}">No hay deportistas.</td></tr>`;
 printShell(`Informe de asistencia · ${['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m-1]} ${y}`,`P = Presente · I = Inasistencia · E = Excusa · R = Retardo`,`<table><thead><tr><th>Deportista</th><th>Deporte</th>${Array.from({length:days},(_,i)=>`<th>${weekdayShort(y,m,i+1)} ${i+1}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`);
}

function club(){
 document.getElementById('app').innerHTML=header('Club y logo','Personaliza la identidad de tu club')+
 `<div class="card" style="margin-bottom:14px"><h3>Nombre de la aplicación</h3><div class="field"><label>Nombre</label><input id="appName" value="${esc(db.appName)}"></div><button class="primary" onclick="saveAppName()">Guardar nombre</button></div>
 <div class="grid2"><div class="card"><h3>Nombre del club</h3><div class="field"><label>Nombre</label><input id="clubName" value="${esc(db.club.name)}"></div><button class="primary" onclick="saveClubName()">Guardar nombre</button></div>
 <div class="card"><h3>Logo</h3><div class="logoBox">${db.club.logo?`<img class="logoPreview" src="${db.club.logo}">`:'<div class="logoPreview" style="display:grid;place-items:center;font-size:28px">🏆</div>'}<div><input id="clubLogo" type="file" accept="image/*"><p class="muted">PNG o JPG, recomendado cuadrado.</p><button class="primary" onclick="saveLogo()">Guardar logo</button></div></div></div>`;
}
function saveAppName(){db.appName=document.getElementById('appName').value.trim()||'ClubGestor V2';save();render()}
function saveClubName(){db.club.name=document.getElementById('clubName').value.trim()||'Mi Club Deportivo';save();render()}
function saveLogo(){const f=document.getElementById('clubLogo').files[0];if(!f)return alert('Seleccione una imagen.');if(f.size>1500000)return alert('El logo debe pesar menos de 1.5 MB.');const r=new FileReader();r.onload=()=>{db.club.logo=r.result;save();render()};r.readAsDataURL(f)}

render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
